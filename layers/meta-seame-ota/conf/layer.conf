# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-seame-ota"
BBFILE_PATTERN_meta-seame-ota = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-seame-ota = "10"

LAYERDEPENDS_meta-seame-ota = "core tegra swupdate"
LAYERSERIES_COMPAT_meta-seame-ota = "scarthgap"

# SWUpdate OTA: A/B 이중화 레이아웃 + swupdate 데몬 포함
# USE_REDUNDANT_FLASH_LAYOUT = "1" 설정 시 QSPI + microSD 모두 A/B 레이아웃으로 구성됨.
# 이후에는 반드시 doflash.sh로 전체 재플래싱 필요.
USE_REDUNDANT_FLASH_LAYOUT = "1"
IMAGE_INSTALL:append = " swupdate"
IMAGE_FSTYPES:append = " tar.gz"

# ※ meta-swupdate 레이어는 bblayers.conf에 수동 등록 필요 (build/는 .gitignore 제외)
#   클론 후 최초 1회 실행:
#     cd tegra-demo-distro
#     source layers/oe-init-build-env build
#     bitbake-layers add-layer ../layers/meta-swupdate
#     bitbake-layers add-layer ../layers/meta-seame-ota
