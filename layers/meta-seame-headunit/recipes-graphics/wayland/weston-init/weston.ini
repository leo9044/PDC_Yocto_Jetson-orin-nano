[core]
backend=drm-backend.so
require-input=false
idle-time=0

[shell]
panel-position=none
locking=false

[libinput]
enable-tap=true

[keyboard]
keymap_layout=us

# Portrait mode: display physically rotated 90 degrees clockwise
# transform=90  → content rotated 90° CCW (top of display = left edge of physical panel)
# transform=270 → content rotated 90° CW  (top of display = right edge of physical panel)
# Adjust based on which way the Elecrow 13.3" is mounted.
[output]
name=HDMI-A-1
transform=90
