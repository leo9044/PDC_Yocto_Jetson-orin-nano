[core]
backend=drm-backend.so
require-input=false
idle-time=0

[shell]
panel-position=none
locking=false

[libinput]
enable-tap=true

[keyboard]
keymap_layout=us

# ── TEST: DP display (landscape, no rotation needed) ────────────
# No [output] section required — Weston uses default orientation.

# ── TARGET: Elecrow 13.3" 4K (MiniHDMI, portrait mount) ─────────
# Uncomment the block below when the MiniHDMI cable arrives.
# The display is mounted vertically; Weston must rotate content 90°.
# If image appears upside-down, change transform=90 → transform=270.
#
# [output]
# name=HDMI-A-1
# transform=90
