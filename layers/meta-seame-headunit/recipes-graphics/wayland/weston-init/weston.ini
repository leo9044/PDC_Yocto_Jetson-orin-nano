[core]
backend=drm-backend.so
require-input=false
idle-time=0

[shell]
panel-position=none
locking=false

[libinput]
enable-tap=true

[keyboard]
keymap_layout=us

# ── TEST: DP display (landscape, no rotation needed) ────────────
# Jetson Orin Nano DP port → DP-1 output name
[output]
name=DP-1
transform=normal

# ── TARGET: Elecrow 13.3" 4K (MiniHDMI, portrait mount) ─────────
# When Elecrow cable arrives: comment out DP-1 block above,
# uncomment the block below instead.
# If image appears upside-down, change transform=90 → transform=270.
#
# [output]
# name=HDMI-A-1
# transform=90
