# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-seame-headunit"
BBFILE_PATTERN_meta-seame-headunit = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-seame-headunit = "10"

LAYERDEPENDS_meta-seame-headunit = "core tegra qt5-layer openembedded-layer meta-middleware"
LAYERSERIES_COMPAT_meta-seame-headunit = "scarthgap"

# Mask gtk4 (Vulkan link error, not needed for Qt5-based apps)
BBMASK += ".*/meta/recipes-gnome/gtk\\+/gtk4_.*\\.bb$"
# android-tools: references missing RISC-V patch, not needed on ARM64 Jetson
BBMASK += "meta-oe/recipes-devtools/android-tools"
# build-appliance-image: references Yocto_Build_Appliance.vmx from external servers
BBMASK += "meta/recipes-core/images/build-appliance-image"

# Phase 3-0: cgroup v2 활성화 (Docker --memory/--cpus 리소스 제한 사용 시 필요)
# Jetson은 UBOOT_EXTLINUX_KERNEL_ARGS로 커널 cmdline에 파라미터 추가
UBOOT_EXTLINUX_KERNEL_ARGS:append = " systemd.unified_cgroup_hierarchy=1"

